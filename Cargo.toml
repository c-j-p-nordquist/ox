[package]
name = "ox"
version = "0.1.0"
edition = "2021"
description = "Options contract picker: a backtested trade plan (ENTER / WAIT / NO TRADE) and the contracts that fit it"
license = "MIT"
repository = "https://github.com/c-j-p-nordquist/ox"
readme = "README.md"
keywords = ["options", "trading", "backtest", "cli"]
categories = ["command-line-utilities", "finance"]

[[bin]]
name = "ox"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
toml = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
